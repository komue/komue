<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>komue · wild matrix</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        background: #050505;
        color: #e5ffe5;
        font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas,
          "Liberation Mono", monospace;
        min-height: 100%;
      }
      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 48px 24px 96px;
        gap: 48px;
      }
      header {
        text-align: center;
        display: flex;
        flex-direction: column;
        gap: 8px;
        max-width: 720px;
      }
      header h1 {
        margin: 0;
        font-size: 28px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: #7CFFB2;
      }
      header p {
        margin: 0;
        font-size: 14px;
        color: #9aa39a;
        letter-spacing: 0.04em;
      }
      .feature {
        display: flex;
        justify-content: center;
        width: 100%;
        max-width: 960px;
      }
      .feature img {
        width: 100%;
        height: auto;
        border-radius: 12px;
        box-shadow: 0 0 0 1px rgba(124, 255, 178, 0.18),
          0 24px 60px rgba(0, 0, 0, 0.6);
        background: #000;
      }
      .gallery {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
        gap: 16px;
        width: 100%;
        max-width: 1200px;
      }
      .card {
        display: flex;
        flex-direction: column;
        gap: 8px;
        padding: 12px;
        background: #0c0f0c;
        border: 1px solid #1a2a1a;
        border-radius: 10px;
      }
      .card img {
        width: 100%;
        height: auto;
        border-radius: 6px;
        background: #000;
      }
      .card figcaption {
        font-size: 12px;
        color: #9aa39a;
        text-align: center;
        letter-spacing: 0.05em;
      }
      footer {
        font-size: 12px;
        color: #4a584a;
        letter-spacing: 0.08em;
      }
      footer a {
        color: #7CFFB2;
        text-decoration: none;
      }
      footer a:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>komue</h1>
      <p>wild matrix · animated terminal art</p>
    </header>

    <section class="feature" aria-label="featured matrix animation">
      <img src="./wild_matrix_v8.gif" alt="wild matrix v8 animation" />
    </section>

    <section class="gallery" aria-label="other animations">
      <figure class="card">
        <img src="./wild_matrix_v7.gif" alt="wild matrix v7 animation" />
        <figcaption>wild_matrix_v7.gif</figcaption>
      </figure>
      <figure class="card">
        <img src="./wild_matrix.gif" alt="wild matrix animation" />
        <figcaption>wild_matrix.gif</figcaption>
      </figure>
      <figure class="card">
        <img
          src="./matrix_letters_colorful.gif"
          alt="matrix letters colorful animation"
        />
        <figcaption>matrix_letters_colorful.gif</figcaption>
      </figure>
    </section>

    <footer>
      <a href="https://github.com/komue/komue" target="_blank" rel="noreferrer"
        >github.com/komue/komue</a
      >
    </footer>
  </body>
</html>
